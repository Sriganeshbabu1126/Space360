name: Android Build & Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Create mock google-services.json
      run: |
        cat << 'EOF' > app/google-services.json
        {
          "project_info": {
            "project_number": "123456789012",
            "project_id": "field-check-72967",
            "storage_bucket": "field-check-72967.appspot.com"
          },
          "client": [
            {
              "client_info": {
                "mobilesdk_app_id": "1:123456789012:android:abcdef1234567890",
                "android_client_info": {
                  "package_name": "com.space360.mobile"
                }
              },
              "api_key": [
                {
                  "current_key": "AIzaSyDummyKeyForMockingFirebase1234"
                }
              ]
            }
          ],
          "configuration_version": "1"
        }
        EOF

    - name: Run Unit Tests
      run: ./gradlew test --no-configuration-cache

    - name: Build Debug APK
      run: ./gradlew assembleDebug --no-configuration-cache

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
