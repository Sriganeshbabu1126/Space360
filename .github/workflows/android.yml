name: Android Build & Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Inject real google-services.json
      env:
        GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
      run: |
        if [ -z "$GOOGLE_SERVICES_JSON" ]; then
          echo "WARNING: GOOGLE_SERVICES_JSON secret is missing! Creating a dummy file so build doesn't fail immediately, but login WILL NOT WORK."
          cat << 'EOF' > app/google-services.json
          {
            "project_info": { "project_number": "0", "project_id": "dummy" },
            "client": [ { "client_info": { "mobilesdk_app_id": "1:0:android:0", "android_client_info": { "package_name": "com.space360.mobile" } }, "api_key": [ { "current_key": "dummy" } ] } ],
            "configuration_version": "1"
          }
        EOF
        else
          echo "$GOOGLE_SERVICES_JSON" > app/google-services.json
        fi

    - name: Run Unit Tests
      run: ./gradlew test --no-configuration-cache

    - name: Build Debug APK
      run: ./gradlew assembleDebug --no-configuration-cache

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
